openapi: 3.0.1
info:
  title: Team Payments API
  description: Charge, refund, and payment status. Owned by Team Payments.
  version: '1.0'
servers:
  - url: https://apim-y3ownlt7uuuqu.azure-api.net/team-payments
paths:
  /refund:
    post:
      summary: Refund a payment
      operationId: post-refund
      responses:
        '200':
          description: ''
  /status:
    get:
      summary: Get payment status
      operationId: get-payment-status
