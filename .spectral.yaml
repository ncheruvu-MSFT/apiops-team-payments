# Spectral ruleset enforcing Team Payments' naming convention. Real blocking gate in
# run-publisher.yml (not `|| true`).
#
# NOTE: checks servers[0].url rather than individual paths -- the real Azure/apiops extractor
# nests the API's own path segment into servers[0].url and makes `paths` relative to it.
extends: []
rules:
  team-scoped-server-url:
    description: 'servers[0].url must be scoped under .../team-payments (NAMING-CONVENTIONS.md)'
    message: "servers[0].url '{{value}}' must end with /team-payments -- this repo only owns Team Payments' API surface"
    severity: error
    given: "$.servers[0].url"
    then:
      function: pattern
      functionOptions:
        match: "/team-payments$"

  operation-id-kebab-case:
    description: 'operationId must be kebab-case: <verb>-<resource>[-<detail>]'
    message: "operationId '{{value}}' must be kebab-case, e.g. post-refund"
    severity: error
    given: "$.paths[*][*].operationId"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"

  title-must-match-team:
    description: 'info.title must match the API display name convention'
    message: "info.title '{{value}}' must start with 'Team Payments'"
    severity: error
    given: "$.info.title"
    then:
      function: pattern
      functionOptions:
        match: "^Team Payments"
