# APIOps PUBLISHER -- Team Payments (auto on push to main).
name: APIOps - Publish (Team Payments)

on:
  push:
    branches: [main]
    paths:
      - 'apimartifacts/**'
      - 'configuration.*.yaml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

env:
  APIOPS_RELEASE_VERSION: v7.0.4
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
  API_MANAGEMENT_SERVICE_NAME: ${{ vars.API_MANAGEMENT_SERVICE_NAME }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint OpenAPI spec against naming conventions (BLOCKING -- no || true)
        run: |
          npm install -g @stoplight/spectral-cli
          spectral lint "apimartifacts/apis/**/specification.yaml" --ruleset .spectral.yaml

  publish:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, id-apiops-team-payments)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Run publisher (no --delete-unmatched)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/Azure/apiops/releases/download/${APIOPS_RELEASE_VERSION}/publisher-linux-x64.zip" -o publisher.zip
          mkdir -p publisher && unzip -q publisher.zip -d publisher && chmod +x publisher/publisher
          export API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH="${GITHUB_WORKSPACE}/apimartifacts"
          ./publisher/publisher

      - name: Tag & release the published state (traceability)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TIMESTAMP="$(date -u +%Y%m%d-%H%M%S)"
          TAG="published/${TIMESTAMP}-${SHORT_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Published to ${API_MANAGEMENT_SERVICE_NAME} (run #${GITHUB_RUN_NUMBER})"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Published to ${API_MANAGEMENT_SERVICE_NAME} - ${SHORT_SHA} (run #${GITHUB_RUN_NUMBER})" \
            --notes "**Deployed commit:** ${GITHUB_SHA}
          **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          **Target APIM:** ${API_MANAGEMENT_SERVICE_NAME} (${AZURE_RESOURCE_GROUP_NAME})
          **apiops release:** ${APIOPS_RELEASE_VERSION}
          **Published at (UTC):** ${TIMESTAMP}"
