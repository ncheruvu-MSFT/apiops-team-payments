# APIOps PUBLISHER -- Team Payments (auto on push to main).
name: APIOps - Publish (Team Payments)

on:
  push:
    branches: [main]
    paths:
      - 'apimartifacts/**'
      - 'configuration.*.yaml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  APIOPS_RELEASE_VERSION: v7.0.4
  AZURE_CLIENT_ID: 65b990e2-0c49-44cf-9b8f-c6059790f1db
  AZURE_TENANT_ID: 62c0cb46-1fcc-4c79-ba1b-d7d9fdfbaa68
  AZURE_SUBSCRIPTION_ID: 31613fe0-1e9b-4a97-b771-dc48fbaa0fbb
  AZURE_RESOURCE_GROUP_NAME: apim-infra-simple-apim-2
  API_MANAGEMENT_SERVICE_NAME: apim-y3ownlt7uuuqu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint OpenAPI spec against naming conventions (BLOCKING -- no || true)
        run: |
          npm install -g @stoplight/spectral-cli
          spectral lint "apimartifacts/apis/**/specification.yaml" --ruleset .spectral.yaml

  publish:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, id-apiops-team-payments)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Run publisher (no --delete-unmatched)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/Azure/apiops/releases/download/${APIOPS_RELEASE_VERSION}/publisher-linux-x64.zip" -o publisher.zip
          mkdir -p publisher && unzip -q publisher.zip -d publisher && chmod +x publisher/publisher
          export API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH="${GITHUB_WORKSPACE}/apimartifacts"
          ./publisher/publisher
